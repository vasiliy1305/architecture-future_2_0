name: Terraform CI

on:
  pull_request:
    paths:
      - 'Task2Advanced/**'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - main
    paths:
      - 'Task2Advanced/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task2Advanced

    env:
      TF_VAR_aws_region: ${{ secrets.TF_VAR_AWS_REGION }}
      TF_VAR_aws_access_key: ${{ secrets.TF_VAR_AWS_ACCESS_KEY }}
      TF_VAR_aws_secret_key: ${{ secrets.TF_VAR_AWS_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Write backend config
        run: |
          cat > backend.hcl <<EOF
          bucket                      = "${{ secrets.TF_BACKEND_BUCKET }}"
          key                         = "${{ secrets.TF_BACKEND_KEY }}"
          region                      = "${{ secrets.TF_BACKEND_REGION }}"
          endpoint                    = "${{ secrets.TF_BACKEND_ENDPOINT }}"
          access_key                  = "${{ secrets.TF_BACKEND_ACCESS_KEY }}"
          secret_key                  = "${{ secrets.TF_BACKEND_SECRET_KEY }}"
          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          force_path_style            = true
          EOF

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan