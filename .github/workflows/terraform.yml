name: Terraform CI/CD

on:
  push:
    paths:
      - 'Task2Advanced/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'Task2Advanced/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task2Advanced

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend-config=backend/backend.hcl.example

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=envs/dev/dev.tfvars




  terraform-apply:
    name: Terraform Apply
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    
    defaults:
      run:
        working-directory: Task2Advanced

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config=backend/backend.hcl.example

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=envs/dev/dev.tfvars